<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Embers | Fine Dining Restaurant</title>
    <meta name="description" content="Embers is an award-winning fine dining restaurant offering an unforgettable culinary journey crafted by world-class chefs. Reserve your table today." />
    <meta name="keywords" content="fine dining, luxury restaurant, gourmet food, chef's table, reservations, embers restaurant" />
    <meta name="author" content="Embers Restaurant" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://embers-restaurant.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:title" content="Embers | Fine Dining Restaurant" />
    <meta property="og:description" content="Experience fine dining like never before. Book your table at Embers." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://embers-restaurant.example.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Embers | Fine Dining Restaurant" />
    <meta name="twitter:description" content="Experience fine dining like never before." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Fonts: Playfair Display (display serif), Cormorant Garamond (script/serif), Manrope (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD structured data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Embers",
        "servesCuisine": "Contemporary Fine Dining",
        "priceRange": "$$$$",
        "telephone": "+1-555-010-2024",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "88 Ember Lane",
          "addressLocality": "New York",
          "addressRegion": "NY",
          "postalCode": "10001",
          "addressCountry": "US"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
